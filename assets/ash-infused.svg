<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Single premium pre-roll in a gold tube">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#f6ead0"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#96690f"/>
      <stop offset="0.5" stop-color="#e9c268"/>
      <stop offset="1" stop-color="#b9821e"/>
    </linearGradient>
    <linearGradient id="paper2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f3e3c2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg2)"/>
  <circle cx="140" cy="100" r="85" fill="#efd9a0" opacity="0.35"/>
  <circle cx="680" cy="470" r="105" fill="#efd9a0" opacity="0.25"/>
  <ellipse cx="400" cy="516" rx="240" ry="24" fill="#d9c391" opacity="0.45"/>

  <!-- leaf sprig -->
  <g fill="#7d9b4e">
    <path d="M588 486 C 566 438, 572 392, 598 354 C 626 398, 626 446, 606 484 C 600 492, 592 492, 588 486 Z"/>
    <path d="M622 478 C 606 440, 612 402, 634 372 C 654 410, 652 448, 638 476 C 633 484, 626 484, 622 478 Z" opacity="0.75"/>
  </g>

  <!-- gold tube standing -->
  <g>
    <rect x="470" y="176" width="104" height="330" rx="20" fill="url(#gold2)"/>
    <rect x="470" y="176" width="104" height="64" rx="20" fill="#7c5410" opacity="0.35"/>
    <rect x="470" y="300" width="104" height="10" fill="#fff3d6" opacity="0.55"/>
    <rect x="486" y="196" width="14" height="290" rx="7" fill="#ffffff" opacity="0.35"/>
    <circle cx="522" cy="392" r="30" fill="none" stroke="#fff3d6" stroke-width="3.5" opacity="0.9"/>
    <path d="M500 392 Q522 372 544 392 Q522 406 500 392 Z" fill="#fff3d6" opacity="0.9"/>
  </g>
  <!-- cap beside tube -->
  <g>
    <rect x="592" y="428" width="88" height="78" rx="14" fill="url(#gold2)"/>
    <rect x="592" y="428" width="88" height="20" rx="10" fill="#7c5410" opacity="0.3"/>
    <rect x="604" y="440" width="10" height="54" rx="5" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- the pre-roll, fresh and unlit, leaning -->
  <g transform="rotate(-16 300 330)" stroke="#d9b96a" stroke-width="3">
    <path d="M262 500 L276 190 Q278 168 292 168 Q306 168 308 190 L322 500 Q322 514 308 514 L276 514 Q262 514 262 500 Z" fill="url(#paper2)"/>
    <path d="M280 196 Q292 128 302 168 Q306 186 304 200 Z" fill="#f7ead2"/>
    <rect x="264" y="428" width="56" height="26" fill="url(#gold2)" stroke="none"/>
    <rect x="264" y="470" width="56" height="8" fill="#efd9a0" stroke="none"/>
  </g>
  <!-- second resting in front -->
  <g transform="rotate(9 300 532)" stroke="#d9b96a" stroke-width="2.5">
    <path d="M150 520 L420 520 Q436 520 436 533 Q436 546 420 546 L150 546 Q134 546 136 533 Q134 520 150 520 Z" fill="url(#paper2)"/>
    <path d="M152 522 Q124 533 152 544 Q144 533 152 522 Z" fill="#f7ead2"/>
    <rect x="386" y="520" width="18" height="26" fill="url(#gold2)" stroke="none"/>
  </g>
</svg>
